name: Dumb Gods

# Builds only when Dumb Gods itself changes. Publishes only from main (see game.yml).
on:
  push:
    branches: [main]
    paths: ['dumb-gods/**', '.github/workflows/dumb-gods.yml']
  pull_request:
    paths: ['dumb-gods/**', '.github/workflows/dumb-gods.yml', '.github/workflows/game.yml', '.github/scripts/publish-game.sh']
  workflow_dispatch:

concurrency:
  group: dumb-gods-${{ github.ref }}
  # never cancel a publish on main; on PRs only the latest push matters
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  game:
    uses: ./.github/workflows/game.yml
    with:
      game: dumb-gods
