name: Game (shared)

# Reusable build + publish for every game in this repo. Each game has a tiny caller
# workflow (see dumb-gods.yml) that passes its folder name. The folder must have
# npm scripts typecheck, test, build and smoke, and build to dist/index.html.
#
# Publishing only happens from main. Branches and PRs get the full CI but never deploy.

on:
  workflow_call:
    inputs:
      game:
        description: Folder name of the game. Also its path on gh-pages.
        type: string
        required: true

jobs:
  build:
    name: Typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.game }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.game }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Headless smoke test
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run smoke -- --shots smoke-shots
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game }}-web
          path: ${{ inputs.game }}/dist
          if-no-files-found: error
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game }}-smoke-screenshots
          path: ${{ inputs.game }}/smoke-shots
          if-no-files-found: ignore

  publish:
    # Adds this build to gh-pages/<game>/ without touching other games. Unchanged builds
    # are skipped, and every published build is archived under <game>/builds/.
    name: Publish to gh-pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages-${{ inputs.game }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.game }}-web
          path: build
      - name: Publish
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: .github/scripts/publish-game.sh "${{ inputs.game }}" build/index.html
