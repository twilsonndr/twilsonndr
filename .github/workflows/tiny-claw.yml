name: Tiny Claw

on:
  push:
    paths: ['tiny-claw/**', '.github/workflows/tiny-claw.yml']
  pull_request:
    paths: ['tiny-claw/**', '.github/workflows/tiny-claw.yml']
  workflow_dispatch:

concurrency:
  group: tiny-claw-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: tiny-claw

jobs:
  build:
    name: Typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiny-claw/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Simulation tests (physics, chapters, a bot that has to beat the game)
        run: npm test
      - name: Build single-file game
        run: npm run build
      - name: Headless smoke test (plays every chapter in Chrome, desktop and touch)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run smoke -- --shots smoke-shots
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: tiny-claw-web
          path: tiny-claw/dist
          if-no-files-found: error
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-claw-smoke-screenshots
          path: tiny-claw/smoke-shots
          if-no-files-found: ignore
