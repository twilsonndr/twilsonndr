<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Dumb Gods</title>
    <meta name="description" content="A tiny-planet singularity RPG. God was a mid-level dev. Now it's our turn." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bagel+Fat+One&family=JetBrains+Mono:wght@500;700&display=swap" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="zone"></div>

    <div id="hud">
      <section id="curvecard">
        <div class="ch">
          <span class="yr"><em>YEAR</em><b id="year">2026</b></span>
          <span id="gap" class="gap ok">Alignment is ahead</span>
        </div>
        <canvas id="curve"></canvas>
        <div id="stats"></div>
      </section>

      <section id="quest">
        <p class="eyebrow">Gary says</p>
        <p id="quest-gary"></p>
        <p id="quest-goal"></p>
      </section>

      <div id="topbtns">
        <button id="btn-help" aria-label="Pause and help">❚❚</button>
        <button id="btn-sound" aria-label="Toggle music">♪</button>
      </div>

      <div id="bottomleft">
        <canvas id="radar" aria-label="Planet radar"></canvas>
        <div id="sanity" title="Sanity. Pests drain it. It comes back if you rest."><span>SANITY</span><i><s></s></i></div>
      </div>

      <div id="bottombar">
        <div id="res"></div>
        <button id="btn-bag">Bag <kbd>B</kbd></button>
      </div>

      <div id="touchbtns">
        <button id="t-bag">Bag</button>
        <button id="t-zap">ZAP</button>
      </div>

      <button id="prompt" hidden></button>
      <div id="toasts"></div>
      <div id="ticker"><span class="tag">NEWS</span><div class="track"><span id="ticker-text"></span></div></div>
    </div>
    <div id="labels"></div>
    <div id="modal"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
